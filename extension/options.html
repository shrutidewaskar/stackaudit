<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StackAudit Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #09090b;
      color: #fafafa;
      padding: 32px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      font-size: 18px;
      font-weight: 800;
      border-bottom: 1px solid #27272a;
      padding-bottom: 12px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: #84cc16;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      background-color: #18181b;
      border: 1px solid #27272a;
      color: #ffffff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #84cc16;
    }
    .help-text {
      font-size: 11px;
      color: #71717a;
      margin-top: 4px;
    }
    .btn {
      background-color: #84cc16;
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #a3e635;
    }
    .btn:disabled {
      background-color: #3f3f46;
      color: #71717a;
      cursor: not-allowed;
    }
    .status-msg {
      margin-top: 14px;
      font-size: 12px;
      font-weight: 600;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }
    .status-msg.success {
      display: block;
      background: #14532d;
      color: #bbf7d0;
      border: 1px solid #22c55e;
    }
    .status-msg.error {
      display: block;
      background: #450a0a;
      color: #fecaca;
      border: 1px solid #ef4444;
    }
  </style>
</head>
<body>
  <h1>StackAudit Telemetry <span class="badge">Enterprise</span></h1>

  <div class="form-group">
    <label for="api-url">StackAudit API Endpoint</label>
    <input type="text" id="api-url" placeholder="http://localhost:3000 or https://your-domain.com">
    <div class="help-text">The backend server URL where usage telemetry is securely ingested.</div>
  </div>

  <div class="form-group">
    <label for="token">Organization Pairing Token</label>
    <input type="text" id="token" placeholder="Paste your enrollment token (e.g. stk_enroll_...)">
    <div class="help-text">Generated from your StackAudit Organization Settings dashboard.</div>
  </div>

  <button id="save-btn" class="btn">Pair & Authenticate Extension</button>
  <div id="status" class="status-msg"></div>

  <script src="options.js"></script>
</body>
</html>
